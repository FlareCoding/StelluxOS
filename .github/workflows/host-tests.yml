#
# Host Tests
#
# Builds the userland host tests with the runner's own compiler and runs them,
# for code that no unit test inside Stellux reaches. Also tests the disk image
# script that make image and the flash scripts share.
#

name: Host tests

# Pull requests run every branch under review, so pushes run only for master
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

# A newer commit on a pull request cancels its older run, and each push keeps its own
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install mtools and sgdisk
        run: |
          for attempt in 1 2 3; do
            sudo timeout 60 apt-get update -qq && sudo timeout 120 apt-get install -y -qq \
              mtools gdisk && exit 0
            grep -rls azure.archive.ubuntu.com /etc/apt | xargs -r sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' || true
          done
          exit 1

      - name: Run host tests
        run: make host-test
