# The Stellux developer packages, one line per package. See README.md.
#
# <name> <tier> <recipe> <arches> <runner>
#
# tier    default packages are part of every image unless PACKAGES leaves
#         them out, extra packages are included only when PACKAGES names them
# recipe  the directory under packages/ whose build.sh emits the package
# arches  the architectures the package is built for, comma separated
# runner  the GitHub runner labels, comma separated, the publish workflow
#         builds it on, where {arch} stands for the target architecture

binutils default toolchain x86_64,aarch64 ubuntu-latest
chromium extra   chromium  aarch64        self-hosted,{arch}
gcc      default toolchain x86_64,aarch64 ubuntu-latest
python   default toolchain x86_64,aarch64 ubuntu-latest
