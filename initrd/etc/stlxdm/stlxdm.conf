[desktop]
bg_color=0xFF12100D
wallpaper=/etc/res/wallpapers/ember-nebula.jpg

[theme]
bar_color=0xFF1E1E1E
bar_font_size=14
accent_color=0xFF888888
text_color=0xFFCCCCCC
glass_level=glass
glass_tint=warm

[taskbar]
height=48
icon_size=32
spacing=8

[input]
key_repeat_delay_ms=400
key_repeat_interval_ms=40

[shortcut:new_terminal]
key=ctrl+alt+t
action=exec
path=/bin/stlxterm

[shortcut:settings]
key=super+s
action=exec
path=/bin/stlxsettings

[shortcut:task_monitor]
key=super+m
action=exec
path=/bin/stlxterm
args=/bin/stlxtop

[taskbar:terminal]
label=Terminal
path=/bin/stlxterm
icon=/etc/res/icons/terminal-32.png

[taskbar:doom]
label=DOOM
path=/bin/doom
icon=/etc/res/icons/doom-32.png

[taskbar:files]
label=File Manager
path=/bin/file-manager
icon=/etc/res/icons/files-32.png

[taskbar:settings]
label=Settings
path=/bin/stlxsettings
icon=/etc/res/icons/settings-32.png

[autostart:terminal]
path=/bin/stlxterm

[autostart:sshd]
path=/bin/dropbear
args=-F -R

[url_handler:https]
path=/usr/bin/chrome
args=--no-sandbox --no-zygote --disable-gpu --in-process-gpu --user-data-dir=/tmp/chrome --no-first-run --password-store=basic --renderer-process-limit=2 --window-size=780,540 --lang=en-US --accept-lang=en-US

[url_handler:http]
path=/usr/bin/chrome
args=--no-sandbox --no-zygote --disable-gpu --in-process-gpu --user-data-dir=/tmp/chrome --no-first-run --password-store=basic --renderer-process-limit=2 --window-size=780,540 --lang=en-US --accept-lang=en-US
