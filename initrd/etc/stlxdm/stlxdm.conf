[desktop]
bg_color=0xFF12100D
wallpaper=/etc/res/wallpapers/ember-nebula.jpg

[theme]
bar_color=0xFF1E1E1E
bar_font_size=14
text_color=0xFFCCCCCC
glass_level=glass
glass_tint=warm

[input]
key_repeat_delay_ms=400
key_repeat_interval_ms=40

[screenshot]
timer=0
shadow=on
pointer=off
remember_region=on

[shortcut:new_terminal]
key=ctrl+alt+t
action=exec
path=/bin/stlxterm

[shortcut:settings]
key=super+s
action=exec
path=/bin/stlxsettings

[shortcut:displays]
key=super+p
action=exec
path=/bin/stlxsettings
args=--page displays

[shortcut:task_monitor]
key=super+m
action=exec
path=/bin/stlxterm
args=/bin/stlxtop

[shortcut:quick_actions]
key=super+space
action=quick_actions

[shortcut:clipboard]
key=super+v
action=clipboard

[shortcut:capture_screen]
key=super+shift+3
action=screenshot
args=screen

[shortcut:capture_screen_print]
key=shift+print
action=screenshot
args=screen

[shortcut:capture_region]
key=super+shift+4
action=screenshot
args=region

[shortcut:capture_window]
key=alt+print
action=screenshot
args=window

[shortcut:capture_bar]
key=super+shift+5
action=screenshot
args=bar

[shortcut:capture_bar_print]
key=print
action=screenshot
args=bar

[taskbar:terminal]
label=Terminal
path=/bin/stlxterm
icon=/etc/res/icons/terminal-32.png

[taskbar:doom]
label=DOOM
path=/bin/doom
icon=/etc/res/icons/doom-32.png

[taskbar:files]
label=File Manager
path=/bin/file-manager
icon=/etc/res/icons/files-32.png

[taskbar:settings]
label=Settings
path=/bin/stlxsettings
icon=/etc/res/icons/settings-32.png

[action:appearance]
label=Appearance
subtitle=Settings: wallpaper and glass
keywords=wallpaper glass theme tint
action=exec
path=/bin/stlxsettings
args=--page appearance

[action:dock]
label=Dock
subtitle=Settings: the apps pinned to the dock
keywords=launchers pins taskbar
action=exec
path=/bin/stlxsettings
args=--page dock

[action:displays]
label=Displays
subtitle=Settings: where each display sits, which one is main, and each one's mode
keywords=monitors screens resolution refresh layout
action=exec
path=/bin/stlxsettings
args=--page displays

[action:input]
label=Input
subtitle=Settings: how held keys repeat
keywords=keyboard repeat delay
action=exec
path=/bin/stlxsettings
args=--page input

[action:startup]
label=Startup
subtitle=Settings: programs that start with the desktop, and the shortcuts that launch programs
keywords=autostart shortcuts keys
action=exec
path=/bin/stlxsettings
args=--page startup

[action:about]
label=About this computer
subtitle=Settings: this machine and the software on it
keywords=version system memory
action=exec
path=/bin/stlxsettings
args=--page about

[action:task_monitor]
label=Task monitor
subtitle=Processes, CPU and memory, in Terminal
keywords=processes top cpu memory
action=exec
path=/bin/stlxterm
args=/bin/stlxtop

[action:power]
label=Power...
subtitle=Restart or shut down
keywords=restart shutdown reboot off
action=power

[action:capture_screen]
label=Capture screen
subtitle=The display under the pointer, onto the clipboard
icon=/etc/res/icons/doc-image-32.png
keywords=screenshot screen display picture
action=screenshot
args=screen

[action:capture_region]
label=Capture region
subtitle=A region you drag, onto the clipboard
icon=/etc/res/icons/doc-image-32.png
keywords=screenshot region area selection picture
action=screenshot
args=region

[action:capture_window]
label=Capture window
subtitle=The focused window alone with its shadow, onto the clipboard
icon=/etc/res/icons/doc-image-32.png
keywords=screenshot window picture
action=screenshot
args=window

[action:capture_bar]
label=Capture bar
subtitle=A region, a window or a screen, with options and a timer
icon=/etc/res/icons/doc-image-32.png
keywords=screenshot capture timer options picture
action=screenshot
args=bar

[action:clipboard_history]
label=Clipboard history
subtitle=What you copied, to search and paste again
keywords=paste copy history clipboard
action=clipboard

[autostart:terminal]
path=/bin/stlxterm

[autostart:sshd]
path=/bin/dropbear
args=-F -R

[url_handler:https]
path=/usr/bin/chrome
args=--no-sandbox --no-zygote --disable-gpu --in-process-gpu --user-data-dir=/tmp/chrome --no-first-run --password-store=basic --renderer-process-limit=2 --window-size=780,540 --lang=en-US --accept-lang=en-US

[url_handler:http]
path=/usr/bin/chrome
args=--no-sandbox --no-zygote --disable-gpu --in-process-gpu --user-data-dir=/tmp/chrome --no-first-run --password-store=basic --renderer-process-limit=2 --window-size=780,540 --lang=en-US --accept-lang=en-US
